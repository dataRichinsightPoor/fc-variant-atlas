  # ----------------------------------------------------------------- half-life
  - id: YTE
    isotype: IgG1
    mutations: [M252Y, S254T, T256E]
    aliases: [YTE]
    imgt: G1v21
    intent: halflife
    phenotype: Approximately 10-fold increased FcRn binding at pH 6.0 with retained release at pH 7.4; 2- to 4-fold longer serum half-life in humans.
    evidence: functional
    therapeutics: [motavizumab, nirsevimab]
    source: https://doi.org/10.4049/jimmunol.169.9.5171
    notes: >
      The first Fc half-life engineering to be confirmed in humans. T256E
      contributes two new salt bridges to beta-2 microglobulin. The reference
      Fc-FcRn structure 4N0U carries YTE rather than wild-type Fc.

