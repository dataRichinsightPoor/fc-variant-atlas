    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1172/JCI128437
    notes: ""

  - id: SEAKA
    isotype: IgG1
    mutations: [S298A, E333A, K334A]
    aliases: [S298A/E333A/K334A]
    imgt: G1v6
    intent: enhance_adcc
    phenotype: Increased FcgammaRIIIa binding; ADCC enhanced.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1074/jbc.M009483200
    notes: From the original alanine-scanning survey of the Fc interface.

  - id: MGAH22-set
    isotype: IgG1
    mutations: [L235V, F243L, R292P, Y300L, P396L]
    aliases: [margetuximab Fc]
    intent: enhance_adcc
    phenotype: ADCC enhanced; ADCP with FcgammaRIIa-131R absent while FcgammaRIIa-131H is retained; CDC not significantly changed.
    evidence: functional
    therapeutics: [margetuximab]
    source: https://doi.org/10.1186/bcr3069
    notes: >
      One of the few effector-enhanced Fc designs in an approved product, and
      the clearest case of allele-dependent behaviour across FcgammaRIIa-131H
      and -131R.

  - id: stavenhagen-set
    isotype: IgG1
    mutations: [F243L, R292P, Y300L, V305I, P396L]
    aliases: []
    imgt: G1v9
    intent: enhance_adcc
    phenotype: ADCC enhanced; CDC increased 6-fold; ADCP with FcgammaRIIa-131H increased.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1158/0008-5472.CAN-07-0696
    notes: >
      Reported with position 396 as P396L in the source abstract and as P396I
      in some catalogue renderings; IMGT lists G1v9 with V305I and P396I.

  - id: tafasitamab-set
    isotype: IgG1
    mutations: [S239D, K274Q, Y296F, Y300F, L309V, I332E, A339T, V397M]
    aliases: [XmAb5574 Fc]
    intent: enhance_adcc
    phenotype: ADCC enhanced and ADCP with FcgammaRII increased; CDC little changed.
    evidence: functional
    therapeutics: [tafasitamab, talcotuzumab]
    source: https://patents.google.com/patent/WO2015195498A1/en
    notes: >
      The INN sequence carries eight substitutions while the functional
      literature usually describes only S239D/I332E. The six additional changes
      are distant from the FcgammaR interface and their contribution is not
      individually resolved.

  - id: afucosylated
    isotype: IgG1
    mutations: []
    aliases: [afucosylation, low-fucose, glycoengineered]
    intent: enhance_adcc
    phenotype: ADCC enhanced 31-fold with FcgammaRIIIa-158V and 201-fold with FcgammaRIIIa-158F effector cells; ADCP with FcgammaRI and FcgammaRII not significantly changed.
    evidence: functional
    therapeutics: [obinutuzumab, mogamulizumab, benralizumab, inebilizumab, amivantamab, ublituximab, belantamab mafodotin]
    source: https://doi.org/10.1038/6179
    notes: >
      GLYCAN VARIANT, NOT A SEQUENCE VARIANT. It carries no substitutions and
      cannot be rendered as a mutation set, which is exactly why it belongs in
      the atlas: the most clinically successful ADCC enhancement to date is
      invisible to any tool that models Fc engineering as point mutations.
      Sequence-identical material differing only in core fucose spans the
      largest effect size in this table.

  # ---------------------------------------------------------------- FcgammaRIIb
  - id: SELF
