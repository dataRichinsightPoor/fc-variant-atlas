  - id: G1-G2like
    isotype: IgG1
    mutations: [E233P, L234V, L235A, G236del]
    aliases: [IgG2-like lower hinge]
    imgt: G1v50
    intent: silence
    phenotype: Decreased FcgammaR binding by converting the IgG1 lower hinge to an IgG2-like motif.
    evidence: binding
    therapeutics: []
    source: https://doi.org/10.4049/jimmunol.2000961
    notes: >
      Includes a residue deletion, so this variant cannot be represented as a
      pure substitution set and is flagged as non-substitutional.

  - id: IgG1-sigma
    isotype: IgG1
    mutations: [L234A, L235A, G237A, P238S, H268A, A330S, P331S]
    aliases: [IgG1 sigma, IgG1s]
    intent: silence
    phenotype: Near-complete elimination of FcgammaRI, FcgammaRIIa, FcgammaRIIb and FcgammaRIIIa binding; ADCC and CDC abolished; FcRn binding retained.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1016/j.ymeth.2013.06.035
    notes: >
      The IgG1 counterpart of IgG2-sigma, built by importing the sigma residue
      set onto an IgG1 frame.

  - id: IgG2-sigma
    isotype: IgG2
    mutations: [G237A, P238S, H268A, V309L, A330S, P331S]
    disputed_mutations: [V234A]
    aliases: [IgG2 sigma, IgG2s, G2sigma]
    imgt: G2v3
    intent: silence
    phenotype: Near-complete elimination of FcgammaRI, FcgammaRIIa, FcgammaRIIb and FcgammaRIIIa binding; undetectable ADCC, ADCP and CDC; FcRn binding retained.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1016/j.ymeth.2013.06.035
    notes: >
      NUMBERING DISPUTE. The primary publication and most reviews write the
      first substitution as V234A. IMGT lists the same variant as V235A
      (G2v3). This is a real consequence of the shorter IgG2 lower hinge: the
      IgG1 and IgG2 hinges cannot be aligned without a gap, so the EU index
      assigned to the valine depends on where that gap is placed. Under this
      package's alignment EU 234 in IgG2 is a gap and the valine sits at EU
      235, which reproduces the IMGT assignment from sequence alone. The
      substitution is therefore held in `disputed_mutations` rather than
      asserted at one index. Both renderings mean the same physical valine.
      See docs/numbering.md.

  - id: IgG2m4
