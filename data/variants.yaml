  # ---------------------------------------------------------------------- CDC
  - id: EFT
    isotype: IgG1
    mutations: [S267E, H268F, S324T]
    aliases: [EFT]
    imgt: G1v17
    intent: enhance_cdc
    phenotype: Tightest reported C1q affinity in its series; CDC potency of an anti-CD20 enhanced up to 23-fold.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.4161/mabs.2.2.11158
    notes: ""

  - id: RGY
    isotype: IgG1
    mutations: [E345R, E430G, S440Y]
    aliases: [RGY, IgG1-005-RGY]
    imgt: G1v18
    intent: enhance_cdc
    phenotype: Drives IgG hexamer formation in solution with increased C1q binding and enhanced CDC.
    evidence: structural
    therapeutics: []
    source: https://doi.org/10.1126/science.1248943
    notes: >
      Acts on Fc-Fc self-association rather than on the C1q contact itself,
      so the mechanism is assembly stoichiometry, not affinity. RGY
      hexamerizes in solution, which is why the single-substitution E430G is
      preferred therapeutically.

  - id: E430G
    isotype: IgG1
    mutations: [E430G]
    aliases: [HexaBody, E430G]
    imgt: G1v34
    intent: enhance_cdc
    phenotype: Favours IgG hexamerization through increased intermolecular Fc-Fc interaction after antigen binding at the cell surface; CDC enhanced.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1111/imr.13394
    notes: >
      Antigen-dependent by design: assembly is conditional on surface binding,
      which keeps solution-phase complement activation low.

  - id: E345K
    isotype: IgG1
    mutations: [E345K]
    aliases: [Stellabody, E345K]
    intent: enhance_cdc
    phenotype: Hexamer-promoting substitution; increased self-association and enhanced complement potency.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1111/imr.13399
    notes: Self-association rank reported as wild type below E430G below E345K below E345R.

  - id: K326W-E333S
    isotype: IgG1
    mutations: [K326W, E333S]
    aliases: []
    imgt: G1v16
    intent: enhance_cdc
    phenotype: Increased C1q binding and enhanced CDC.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.4049/jimmunol.166.4.2571
    notes: K326W alone enhances CDC while reducing ADCC, an explicit trade between arms.

  - id: K322A
    isotype: IgG1
    mutations: [K322A]
    aliases: []
