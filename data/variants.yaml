    notes: ""

  - id: eculizumab-hybrid
    isotype: IgG4
    mutations: [E233del, F234P, L235V, G236A]
    aliases: [IgG2/IgG4 hybrid]
    imgt: G2G4v1
    intent: silence
    phenotype: Reduced FcgammaR binding and reduced C1q binding.
    evidence: functional
    therapeutics: [eculizumab]
    source: https://doi.org/10.1038/nbt1344
    notes: >
      A chimeric constant region rather than a point-variant series, and one of
      the few silencing designs with a named approved therapeutic attached.
      Contains a deletion and is flagged as non-substitutional. The parent
      frame is recorded as IgG4 because the wild-type residues implied by the
      substitution set (E233, F234, L235, G236) are the IgG4 residues; the
      changes convert an IgG4 lower hinge toward the IgG2 motif. Curating this
      record against IgG2, as its IMGT G2G4v1 label invites, fails sequence
      validation at all four positions.

  # ------------------------------------------------------------- ADCC/ADCP up
  - id: DE
    isotype: IgG1
    mutations: [S239D, I332E]
    aliases: [DE, S239D/I332E]
    imgt: G1v7
    intent: enhance_adcc
    phenotype: Increased FcgammaRIIIa binding; ADCC enhanced; ADCP with FcgammaRII increased modestly.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1073/pnas.0508123103
    notes: The parent of the aspartate/glutamate charge-engineering series.

  - id: DLE
    isotype: IgG1
    mutations: [S239D, A330L, I332E]
    aliases: [DLE, 3M]
    imgt: G1v8
    intent: enhance_adcc
    phenotype: Increased FcgammaRIIIa binding and decreased FcgammaRIIb binding; ADCC enhanced; CDC eliminated.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1073/pnas.0508123103
    notes: >
      A useful counterexample to the assumption that enhancement is monotonic.
      A330L raises ADCC while ablating complement, so the same variant is an
      enhancing and a silencing design depending on the axis measured.

  - id: GASDALIE
    isotype: IgG1
    mutations: [G236A, S239D, A330L, I332E]
    aliases: [GASDALIE]
    imgt: G1v12
    intent: enhance_adcc
    phenotype: Increased FcgammaRIIIa and FcgammaRIIa binding; ADCC and ADCP enhanced; FcgammaRI-mediated phagocytosis increased 1.87-fold; CDC absent.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1073/pnas.1203954109
    notes: Widely used in preclinical immuno-oncology models.

  - id: GASDIE
    isotype: IgG1
    mutations: [G236A, S239D, I332E]
    aliases: [GASDIE, ADE]
    imgt: G1v13
    intent: enhance_adcc
    phenotype: Increased FcgammaRIIIa binding and FcgammaRIIa binding above 70-fold with a 15-fold shift in the FcgammaRIIa/FcgammaRIIb ratio; ADCC and ADCP enhanced; CDC little changed.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1158/1535-7163.MCT-08-0201
    notes: ""

  - id: GAALIE
    isotype: IgG1
    mutations: [G236A, A330L, I332E]
    aliases: [GAALIE]
