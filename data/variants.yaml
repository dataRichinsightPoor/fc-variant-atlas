# Fc Variant Atlas - curated variant records
#
# Every record is keyed by a stable id and carries:
#   isotype      : parent IGHG isotype the substitutions are defined on
#   mutations    : substitutions in EU numbering, "<wt><pos><mut>"
#   aliases      : names used in the literature
#   imgt         : IMGT engineered-variant identifier where one is assigned
#   intent       : what the engineering was designed to do
#   phenotype    : reported functional consequence, direction-explicit
#   evidence     : "functional" | "binding" | "structural" | "claimed"
#   therapeutics : named INNs / clinical molecules using the variant
#   source       : DOI or stable URL for the primary or cataloguing reference
#   notes        : caveats, numbering disputes, residual-activity warnings
#
# Numbering policy: all positions are EU numbering (Edelman 1969). Where a
# source reports a position that disagrees with EU-numbered structure or
# sequence, the disagreement is recorded in `notes` rather than silently fixed.

variants:

  # ---------------------------------------------------------------- silencing
  - id: LALA
    isotype: IgG1
    mutations: [L234A, L235A]
    aliases: [LALA, AA]
    imgt: G1v14
    intent: silence
    phenotype: Reduced binding to FcgammaRI, FcgammaRIIa and FcgammaRIIIa and reduced C1q binding; ADCC, ADCP and CDC reduced but not abolished.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1006/cimm.2000.1617
    notes: >
      The most widely used silencing pair and the most widely over-trusted.
      Residual FcgammaR binding is repeatedly documented; LALA is attenuating,
      not null. Derived from the murine OKT3 lower-hinge alanine substitutions.

  - id: LALA-PG
    isotype: IgG1
    mutations: [L234A, L235A, P329G]
    aliases: [LALA-PG, LALAPG]
    imgt: G1v14-49
    intent: silence
    phenotype: Eliminates measurable FcgammaRI, FcgammaRII and FcgammaRIII binding and abolishes C1q binding and complement fixation; ADCC and ADCP not detected.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.1093/protein/gzw040
    notes: >
      P329G removes the proline-sandwich contact with the receptor FG loop, so
      the two mechanisms are additive rather than redundant. Transfers to murine
      IgG2a, which makes it useful for matched surrogate work.

