      Designed explicitly to reach completeness rather than attenuation, with
      the G236R substitution doing much of the work.

  - id: N297A
    isotype: IgG1
    mutations: [N297A]
    aliases: [N297A, NA, aglycosylated]
    imgt: G1v29
    intent: silence
    phenotype: Removes the conserved CH2 N-glycan; decreased FcgammaRI and FcgammaRIIIa binding and decreased C1q binding.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.4161/mabs.26436
    notes: >
      Silences by deleting the glycan rather than by editing the protein
      interface, and therefore also destabilizes CH2 and lowers the thermal
      transition. Residual binding is documented.

  - id: N297G
    isotype: IgG1
    mutations: [N297G]
    aliases: [N297G]
    imgt: G1v30
    intent: silence
    phenotype: Glycan knockout; ADCC reduced and FcgammaR binding reduced.
    evidence: functional
    therapeutics: []
    source: https://doi.org/10.4161/mabs.26436
    notes: Glycine gives more backbone flexibility than alanine at the same position.

  - id: N297Q
    isotype: IgG1
    mutations: [N297Q]
    aliases: [N297Q, NQ]
    imgt: G1v36
    intent: silence
    phenotype: Glycan knockout; ADCC reduced and FcgammaR binding reduced.
    evidence: functional
    therapeutics: []
