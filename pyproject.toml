[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcatlas"
version = "1.0.1"
description = "Aligned, sequence-validated atlas of engineered IgG Fc variants with measured structural context"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ermelinda Damko" }]
keywords = [
  "antibody", "Fc engineering", "IgG", "EU numbering", "FcgammaR", "FcRn",
  "effector silencing", "structural biology", "PyMOL",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dataRichinsightPoor/fc-variant-atlas"
Source = "https://github.com/dataRichinsightPoor/fc-variant-atlas"

[project.scripts]
fcatlas = "fcatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fcatlas = ["data/*.fasta", "data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
